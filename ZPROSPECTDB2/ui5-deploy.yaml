# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zprospectdb2.zprospectdb2
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DE2
          url: http://pkynj-de2app.porkyproducts.loc:8000
          client: '100'
        app:
          name: ZPROSPECTDB2
          description: Prospect Management
          package: ZFIORI1
          transport: DE2K906690
        exclude:
          - /test/
