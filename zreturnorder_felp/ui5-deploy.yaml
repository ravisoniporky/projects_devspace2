# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: customer.porky.zreturnorderfelp
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
