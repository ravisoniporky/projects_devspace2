# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: customer.porky.zfieldappchat
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: http://pkytx-devapp.porkyproducts.loc:8000
            destination: DEV
          - path: /sap/opu/odata/sap/ZRMM_FRVISITV2_CDS/
            url: http://pkytx-devapp.porkyproducts.loc:8000
            client: '100'
            destination: DEV
          - path: /sap/opu/odata/sap/ZI_DEFAULTSHVH_CDS/
            url: http://pkytx-devapp.porkyproducts.loc:8000
            client: '100'
            destination: DEV
          - path: /sap/opu/odata/sap/ZCXA_USERDEFAULT_CDS/
            url: http://pkytx-devapp.porkyproducts.loc:8000
            client: '100'
            destination: DEV
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
        test:
          - framework: OPA5
            path: /test/integration/opaTests.qunit.html
            pattern: /test/**/AllJourneys.*
          - framework: Testsuite
          - framework: QUnit
            path: /test/unit/unitTests.qunit.html
            pattern: /test/unit/controller/*.{js,ts}
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZODATA_FR_SRV
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZRMM_FRVISITV2_CDS
            metadataPath: ./webapp/localService/ZRMM_FRVISITV2_CDS/metadata.xml
            mockdataPath: ./webapp/localService/ZRMM_FRVISITV2_CDS/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZI_DEFAULTSHVH_CDS
            metadataPath: ./webapp/localService/ZI_DEFAULTSHVH_CDS/metadata.xml
            mockdataPath: ./webapp/localService/ZI_DEFAULTSHVH_CDS/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZCXA_USERDEFAULT_CDS
            metadataPath: ./webapp/localService/ZCXA_USERDEFAULT_CDS/metadata.xml
            mockdataPath: ./webapp/localService/ZCXA_USERDEFAULT_CDS/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/mainService/ZODATA_FR_ANNO_MDL.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZODATA_FR_ANNO_MDL',Version='0001')/$value/
          - localPath: ./webapp/localService/ZRMM_FRVISITV2_CDS/ZRMM_FRVISITV2_CDS_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZRMM_FRVISITV2_CDS_VAN',Version='0001')/$value/
          - localPath: ./webapp/localService/ZI_DEFAULTSHVH_CDS/ZI_DEFAULTSHVH_CDS_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZI_DEFAULTSHVH_CDS_VAN',Version='0001')/$value/
          - localPath: ./webapp/localService/ZCXA_USERDEFAULT_CDS/ZCXA_USERDEFAULT_CDS_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZCXA_USERDEFAULT_CDS_VAN',Version='0001')/$value/
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
