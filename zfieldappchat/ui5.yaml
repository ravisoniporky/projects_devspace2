# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: customer.porky.zfieldappchat
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: http://pkytx-devapp.porkyproducts.loc:8000
            destination: DEV
          - path: /sap/opu/odata/sap/ZRMM_FRVISITV2_CDS/
            url: http://pkytx-devapp.porkyproducts.loc:8000
            client: '100'
            destination: DEV
          - path: /sap/opu/odata/sap/ZI_DEFAULTSHVH_CDS/
            url: http://pkytx-devapp.porkyproducts.loc:8000
            client: '100'
            destination: DEV
          - path: /sap/opu/odata/sap/ZCXA_USERDEFAULT_CDS/
            url: http://pkytx-devapp.porkyproducts.loc:8000
            client: '100'
            destination: DEV
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
