specVersion: "3.1"
metadata:
  name: customer.porky.zsdinfoovpc
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: "100"
            destination: DE2
          - path: /sap
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: "100"
            destination: DE2
            authenticationType: BasicAuthentication
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZODATA_T_ORDSTATUS_SRV
            metadataPath: ./webapp/localService/ZODATA_T_ORDSTATUS_SRV/metadata.xml
            mockdataPath: ./webapp/localService/ZODATA_T_ORDSTATUS_SRV/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/annotations/annotation0.xml
            urlPath: annotations/annotation0.xml
          - localPath: ./webapp/localService/ZODATA_T_ORDSTATUS_SRV/ZODATA_T_ORDSTATUS_SRV_Annotation.xml
            urlPath: /destinations/DE2/sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZODATA_T_ORDSTATUS_ANNO_MDL',Version='0001')/$value/
