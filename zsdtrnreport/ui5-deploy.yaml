# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: customer.porky.zsdtrnreport
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DEV
          url: http://pkytx-devapp.porkyproducts.loc:8000
          client: '100'
        app:
          name: ZSDTRNREPORT
          description: SD Transaction Report
          package: zfiori1
          transport: DEVK915773
        exclude:
          - /test/
          - /localService/
