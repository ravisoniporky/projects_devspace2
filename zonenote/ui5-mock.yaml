# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: customer.porky.zonenote
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: http://pkynj-de2app.porkyproducts.loc:8000
            destination: DE2
          - path: /sap/opu/odata4/sap/zsb_materialverifyv4/srvd/sap/v4/0001/
            url: http://pkytx-devapp.porkyproducts.loc:8000
            client: '100'
            destination: DEV
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
        test:
          - framework: OPA5
            path: /test/integration/opaTests.qunit.html
            pattern: /test/**/AllJourneys.*
          - framework: Testsuite
          - framework: QUnit
            path: /test/unit/unitTests.qunit.html
            pattern: /test/unit/controller/*.{js,ts}
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZCXA_USERDEFAULT_CDS
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /sap/opu/odata4/sap/zui_zonenotehdr_o4/srvd/sap/zui_zonenotehdr_o4/0001
            metadataPath: ./webapp/localService/zoneNoteService/metadata.xml
            mockdataPath: ./webapp/localService/zoneNoteService/data
            generateMockData: true
          - urlPath: /sap/opu/odata4/sap/zsb_materialverifyv4/srvd/sap/v4/0001
            metadataPath: ./webapp/localService/v4/metadata.xml
            mockdataPath: ./webapp/localService/v4/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/mainService/ZCXA_USERDEFAULT_CDS_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZCXA_USERDEFAULT_CDS_VAN',Version='0001')/$value/
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
