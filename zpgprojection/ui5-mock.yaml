specVersion: "3.1"
metadata:
  name: customer.porky.zpgprojection
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: "100"
            destination: DE2
          - path: /sap
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: "100"
            destination: DE2
            authenticationType: BasicAuthentication
          - path: /sap/opu/odata/sap/ZCSD_PG_PROJECTON_CDS
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: "100"
            destination: DE2
            authenticationType: BasicAuthentication
          - path: /sap/opu/odata/sap/ZBXA_PG_PROJECTIONCALENDAR_CDS
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: "100"
            destination: DE2
            authenticationType: BasicAuthentication
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZSB_C_PGPROJECTION
            generateMockData: true
            metadataXmlPath: ./webapp/localService/mainService/metadata.xml
            mockdataRootPath: ./webapp/localService/data
          - urlPath: /sap/opu/odata/sap/ZCSD_PG_PROJECTON_CDS
            generateMockData: true
            metadataXmlPath: ./webapp/localService/ZCSD_PG_PROJECTON_CDS1/metadata.xml
            mockdataRootPath: ./webapp/localService/ZCSD_PG_PROJECTON_CDS1/mockdata
          - urlPath: /sap/opu/odata/sap/ZBXA_PG_PROJECTIONCALENDAR_CDS
            metadataPath: ./webapp/localService/ZBXA_PG_PROJECTIONCALENDAR_CDS/metadata.xml
            mockdataPath: ./webapp/localService/ZBXA_PG_PROJECTIONCALENDAR_CDS/mockdata
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/ZCSD_PG_PROJECTON_CDS/ZCSD_PG_PROJECTON_CDS_Annotation.xml
            urlPath: /destinations/DE2/sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZCSD_PG_PROJECTON_CDS_VAN',Version='0001')/$value/
          - localPath: ./webapp/localService/ZCSD_PG_PROJECTON_CDS/ZCSD_PG_PROJECTON_CDS_Annotation1.xml
            urlPath: /destinations/DE2/sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='47C8C7D136B61EDF92A36B4AC8766592',Version='0001')/$value/
          - localPath: ./webapp/localService/ZCSD_PG_PROJECTON_CDS1/ZCSD_PG_PROJECTON_CDS1_Annotation.xml
            urlPath: /destinations/DE2/sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZCSD_PG_PROJECTON_CDS_VAN',Version='0001')/$value/
          - localPath: ./webapp/localService/ZCSD_PG_PROJECTON_CDS1/ZCSD_PG_PROJECTON_CDS1_Annotation1.xml
            urlPath: /destinations/DE2/sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='47C8C7D136B61EDF92A36B4AC8766592',Version='0001')/$value/
          - localPath: ./webapp/localService/ZBXA_PG_PROJECTIONCALENDAR_CDS/ZBXA_PG_PROJECTIONCALENDAR_CDS_Annotation.xml
            urlPath: /destinations/DE2/sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZBXA_PG_PROJECTIONCALENDAR_C_VAN',Version='0001')/$value/
