# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: customer.porky.zsdcustsodashe2
type: application
framework:
  name: SAPUI5
  version: 1.108.28
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: sap.f
    - name: sap.ui.comp
    - name: sap.ui.generic.app
    - name: sap.suite.ui.generic.template
    - name: sap.ovp
    - name: sap.ui.rta
    - name: sap.ui.layout
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        backend:
          - path: /sap/opu/odata/sap/ZSB_C_ORDERDASHBOARD/
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: '100'
            destination: DE2
          - path: /sap/opu/odata/sap/ZRMM_FRVISITV2_CDS
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: '100'
            destination: DE2
            authenticationType: BasicAuthentication
          - path: /sap/opu/odata/sap/ZODATA_FR_SRV
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: '100'
            destination: DE2
          - path: /sap/opu/odata/sap/ZODATA_ORDERDASHFI_SRV
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: '100'
            authenticationType: BasicAuthentication
            destination: DE2
          - path: /sap/opu/odata/sap/ZODATA_ORDERDASH_SRV
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: '100'
            authenticationType: BasicAuthentication
            destination: DE2
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZSB_C_ORDERDASHBOARD
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZRMM_FRVISITV2_CDS
            metadataPath: ./webapp/localService/ZRMM_FRVISITV2_CDS/metadata.xml
            mockdataPath: ./webapp/localService/ZRMM_FRVISITV2_CDS/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZODATA_FR_SRV
            metadataPath: ./webapp/localService/ZODATA_FR_SRV/metadata.xml
            mockdataPath: ./webapp/localService/ZODATA_FR_SRV/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZODATA_ORDERDASHFI_SRV
            metadataPath: ./webapp/localService/ZODATA_ORDERDASHFI_SRV/metadata.xml
            mockdataPath: ./webapp/localService/ZODATA_ORDERDASHFI_SRV/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZODATA_ORDERDASH_SRV
            metadataPath: ./webapp/localService/ZODATA_ORDERDASH_SRV/metadata.xml
            mockdataPath: ./webapp/localService/ZODATA_ORDERDASH_SRV/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/mainService/ZSB_C_ORDERDASHBOARD_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZSB_C_ORDERDASHBOARD_VAN',Version='0001')/$value/
          - localPath: ./webapp/localService/ZRMM_FRVISITV2_CDS/ZRMM_FRVISITV2_CDS_Annotation.xml
            urlPath: /destinations/DE2/sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZRMM_FRVISITV2_CDS_VAN',Version='0001')/$value/
          - localPath: ./webapp/localService/ZODATA_ORDERDASHFI_SRV/ZODATA_ORDERDASHFI_ANNO_MDL.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZODATA_ORDERDASHFI_ANNO_MDL',Version='0001')/$value/
          - localPath: ./webapp/localService/ZODATA_ORDERDASH_SRV/ZODATA_ORDERDASH_ANNO_MDL.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZODATA_ORDERDASH_ANNO_MDL',Version='0001')/$value/
          - localPath: ./webapp/localService/ZODATA_FR_SRV/ZODATA_FR_ANNO_MDL.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZODATA_FR_ANNO_MDL',Version='0001')/$value/
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: customer.porky.zsdcustsodashe2
        ui5Theme: sap_horizon
