specVersion: "3.1"
metadata:
  name: customer.porky.zbpcontactcreate
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - url: http://pkynj-de2app.porkyproducts.loc:8000
            client: '100'
            destination: DE2
            path: /sap/opu/odata/sap/ZCFI_WEBEXDASH_BPCONTACT_CDS
          - path: /sap
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: "100"
            destination: DE2
            authenticationType: BasicAuthentication
          - path: /sap/opu/odata/sap/ZCXA_USERDEFAULT_CDS
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: "100"
            destination: DE2
            authenticationType: BasicAuthentication
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZODATA_WEBEXDASH_BPCONTACT_SRV
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZCFI_WEBEXDASH_BPCONTACT_CDS
            metadataPath: ./webapp/localService/ZCFI_WEBEXDASH_BPCONTACT_CDS/metadata.xml
            mockdataPath: ./webapp/localService/ZCFI_WEBEXDASH_BPCONTACT_CDS/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZCXA_USERDEFAULT_CDS
            metadataPath: ./webapp/localService/ZCXA_USERDEFAULT_CDS/metadata.xml
            mockdataPath: ./webapp/localService/ZCXA_USERDEFAULT_CDS/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/ZCXA_USERDEFAULT_CDS/ZCXA_USERDEFAULT_CDS_Annotation.xml
            urlPath: /destinations/DE2/sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZCXA_USERDEFAULT_CDS_VAN',Version='0001')/$value/
          - localPath: ./webapp/localService/ZCFI_WEBEXDASH_BPCONTACT_CDS/ZCFI_WEBEXDASH_BPCONTACT_CDS_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZCFI_WEBEXDASH_BPCONTACT_CDS_VAN',Version='0001')/$value/
