# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: customer.porky.zfieldrepvisit
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DEV
          url: https://dev.porky.com
          client: '100'
        app:
          name: ZFIELDREPVISIT
          package: zfiori1
          transport: DE2K907172
        exclude:
          - /test/
