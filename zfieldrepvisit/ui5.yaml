# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: customer.porky.zfieldrepvisit
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: '100'
            destination: DE2
          - path: /sap
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: '100'
            destination: DE2
          - url: http://pkynj-de2app.porkyproducts.loc:8000
            client: '100'
            destination: DE2
            path: /sap/opu/odata/sap/ZODATA_FR_SRV
          - path: /sap/opu/odata/sap/ZRMM_FRVISITV2_CDS
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: '100'
            destination: DE2
            authenticationType: BasicAuthentication
          - path: /sap/opu/odata/sap/ZBMM_FRVISITDEFSUPP_CDS
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: '100'
            destination: DE2
            authenticationType: BasicAuthentication
          - path: /sap/opu/odata/sap/ZCXA_USERDEFAULT_CDS
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: '100'
            destination: DE2
          - path: /sap/opu/odata/sap/ZCXA_USERAUTH_CDS
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: '100'
            destination: DE2
          - path: /sap/opu/odata/sap/ZODATA_FIELDREP_IMAGES_V2_SRV
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: '100'
            destination: DE2
            authenticationType: BasicAuthentication
          - path: /sap/opu/odata/sap/ZI_DEFAULTSHVH_CDS
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: '100'
            destination: DE2
            authenticationType: BasicAuthentication
          - path: /sap/opu/odata/sap/ZSB_C_FRVISIT2
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: '100'
            destination: DE2
            authenticationType: BasicAuthentication
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: customer.porky.zfieldrepvisit
        ui5Theme: sap_horizon
framework:
  name: SAPUI5
  version: "1.143.0"
