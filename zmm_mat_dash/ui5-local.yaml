# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: customer.porky.zmmmatdash
type: application
framework:
  name: SAPUI5
  version: 1.108.28
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: sap.f
    - name: sap.ui.comp
    - name: sap.ui.generic.app
    - name: sap.suite.ui.generic.template
    - name: sap.ovp
    - name: sap.ui.rta
    - name: sap.ui.layout
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: customer.porky.zmmmatdash
        ui5Theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        backend:
          - scp: true
            path: /sap
            url: http://pkynj-de2app.porkyproducts.loc:8000
            destination: DE2
          - path: /sap/opu/odata/sap/ZODATA_MATERIAL_BLOCKS_SRV_01
            url: http://pkynj-de2app.porkyproducts.loc:8000
            client: '100'
            destination: DE2
            authenticationType: BasicAuthentication
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZSB_MM_MATERIALDASHBOARD
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZODATA_MATERIAL_BLOCKS_SRV_01
            metadataPath: ./webapp/localService/ZODATA_MATERIAL_BLOCKS_SRV_01/metadata.xml
            mockdataPath: ./webapp/localService/ZODATA_MATERIAL_BLOCKS_SRV_01/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/mainService/ZSB_MM_MATERIALDASHBOARD_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZSB_MM_MATERIALDASHBOARD_VAN',Version='0001')/$value/
