# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: customer.porky.zcustardash
type: application
framework:
  name: SAPUI5
  version: 1.108.28
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: sap.f
    - name: sap.ui.comp
    - name: sap.ui.generic.app
    - name: sap.suite.ui.generic.template
    - name: sap.ovp
    - name: sap.ui.rta
    - name: sap.ui.layout
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        backend:
          - path: /sap/opu/odata/sap/ZCFI_CUSTARDASH_CDS/
            url: https://dev.porky.com
            client: '100'
            destination: DEV
            authenticationType: BasicAuthentication
          - path: /sap/opu/odata/sap/ZCFI_CUSTARDASH_CDS
            url: https://dev.porky.com
            client: '100'
            destination: DEV
            authenticationType: BasicAuthentication
          - path: /sap/opu/odata/sap/ZSB_CUSTARDASH/
            url: https://dev.porky.com
            client: '100'
            destination: DEV
          - path: /sap/opu/odata/sap/ZODATA_CUSTOMER_BLOCKS_SRV
            url: https://dev.porky.com
            client: '100'
            destination: DEV
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZSB_CUSTARDASH
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZSB_CUSTARDASH
            metadataPath: ./webapp/localService/ZSB_CUSTARDASH/metadata.xml
            mockdataPath: ./webapp/localService/ZSB_CUSTARDASH/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZODATA_CUSTOMER_BLOCKS_SRV
            metadataPath: ./webapp/localService/ZODATA_CUSTOMER_BLOCKS_SRV/metadata.xml
            mockdataPath: ./webapp/localService/ZODATA_CUSTOMER_BLOCKS_SRV/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/ZSB_CUSTARDASH/ZSB_CUSTARDASH_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZSB_CUSTARDASH_VAN',Version='0001')/$value/
          - localPath: ./webapp/localService/ZODATA_CUSTOMER_BLOCKS_SRV/ZODATA_CUSTOMER_BLOCKS_ANNO_MDL.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZODATA_CUSTOMER_BLOCKS_ANNO_MDL',Version='0001')/$value/
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: customer.porky.zcustardash
        ui5Theme: sap_horizon
