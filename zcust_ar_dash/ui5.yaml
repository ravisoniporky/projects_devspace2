# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: customer.porky.zcustardash
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap/opu/odata/sap/ZCFI_CUSTARDASH_CDS/
            url: https://dev.porky.com
            client: '100'
            destination: DEV
            authenticationType: BasicAuthentication
          - path: /sap/opu/odata/sap/ZCFI_CUSTARDASH_CDS
            url: https://dev.porky.com
            client: '100'
            destination: DEV
            authenticationType: BasicAuthentication
          - path: /sap/opu/odata/sap/ZSB_CUSTARDASH/
            url: https://dev.porky.com
            client: '100'
            destination: DEV
          - path: /sap/opu/odata/sap/ZODATA_CUSTOMER_BLOCKS_SRV
            url: https://dev.porky.com
            client: '100'
            destination: DEV
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: customer.porky.zcustardash
        ui5Theme: sap_horizon
